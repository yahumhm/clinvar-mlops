services:
  clinvar-api:
    build: .
    container_name: clinvar_fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./monitoring:/app/monitoring
    restart: unless-stopped

  mlflow-ui:
    build: .
    container_name: clinvar_mlflow
    command: mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.10.2
    container_name: clinvar_airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas numpy scikit-learn mlflow scipy joblib
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
    ports:
      - "8080:8080"
    command: standalone
    restart: unless-stopped