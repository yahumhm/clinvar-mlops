stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - data/raw/clinvar_raw.csv
      - src/preprocess.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - models/encoders.pkl

  train:
    cmd: python src/train.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train.py
    outs:
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false
